<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 版本号 v=1.6.0：每次改动资源后递增，避免浏览器把新旧脚本混用导致模块错乱 -->
  <meta name="description" content="广州中小学同步学习资料：小学 1—6 年级语文数学英语，初中 7—9 年级语数英及物理化学生物道德与法治历史地理，课前预习、课后复习、课本跟读、通关挑战，支持语音朗读。">
  <title>穗学伴 · 广州中小学同步学习资料</title>
  <link rel="stylesheet" href="css/style.css?v=__VER__">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="topbar"></header>
      <div id="content"></div>
    </main>
  </div>
  <div id="modal-root"></div>

  <!-- ===== A. 骨架层：仅 config 同步，保证 app.js 执行时 APP_CONFIG 已就绪 ===== -->
  <script src="js/config.js?v=__VER__"></script>

  <!-- ===== B. 首屏层：defer，不阻塞解析，DOMContentLoaded 前按序执行 ===== -->
  <script defer src="js/data-core.js?v=__VER__"></script>
  <script defer src="js/data-english.js?v=__VER__"></script>
  <script defer src="js/data-text.js?v=__VER__"></script>
  <script defer src="js/data-text-init.js?v=__VER__"></script>
  <script defer src="js/data-subjects.js?v=__VER__"></script>
  <script defer src="js/data-basic.js?v=__VER__"></script>
  <script defer src="js/speech.js?v=__VER__"></script>
  <script defer src="js/math-drill.js?v=__VER__"></script>
  <script defer src="js/sound.js?v=__VER__"></script>
  <script defer src="js/analytics.js?v=__VER__"></script>
  <script defer src="js/app.js?v=__VER__"></script>

  <!-- ===== C. 字库层：基础引擎 + 按年级小包，不进首屏 ===== -->
  <script>
  window.__HZ_VER__ = '__VER__';
  /* 基础引擎很小：笔顺渲染器 + 元信息；字库小包按年级单独加载 */
  window.HZ_BASE = [
    'vendor/hanzi-writer.min.js',
    'js/hanzi-meta.js',
    'js/strokes.js'
  ];
  window.HZ_PACKS = {
    1: 'js/hanzi-g1.js', 2: 'js/hanzi-g2.js', 3: 'js/hanzi-g3.js', 4: 'js/hanzi-g4.js',
    5: 'js/hanzi-grade56.js', 6: 'js/hanzi-grade56.js',
    7: 'js/hanzi-junior.js', 8: 'js/hanzi-junior.js', 9: 'js/hanzi-junior.js'
  };
  window.__hzBaseReady = false;
  window.__hzPacks = {};
  window.__hzPending = {};
  window.__hzLoaded = false;
  window.__hzReady = false;

  function loadHzScript(src) {
    return new Promise(function (res, rej) {
      var code = (window.__HZ_INLINE__ || {})[src];
      if (code != null) {
        try { window.eval(code); res(); } catch (e) { rej(e); }
        return;
      }
      var t = document.createElement('script');
      t.src = src + (window.__HZ_VER__ && window.__HZ_VER__ !== '__VER__' ? '?v=' + window.__HZ_VER__ : '');
      t.onload = res; t.onerror = rej;
      document.head.appendChild(t);
    });
  }

  window.loadHanzi = function (reason, grade) {
    var g = grade || window.SX_GRADE || 1;
    var pack = window.HZ_PACKS[g] || window.HZ_PACKS[1];
    window.__hzLoaded = true;
    var jobs = [];
    if (!window.__hzBaseReady) {
      if (!window.__hzPending.__base) {
        window.__hzPending.__base = Promise.all(window.HZ_BASE.map(loadHzScript)).then(function () {
          window.__hzBaseReady = true;
        }).catch(function (e) { window.__hzPending.__base = null; throw e; });
      }
      jobs.push(window.__hzPending.__base);
    }
    if (window.__hzPacks[pack] !== 'ready') {
      if (!window.__hzPending[pack]) {
        window.__hzPending[pack] = loadHzScript(pack).then(function () {
          window.__hzPacks[pack] = 'ready';
          window.__hzReady = window.__hzBaseReady;
          document.dispatchEvent(new CustomEvent('hanzi:ready', {
            detail: { reason: reason, grade: g, pack: pack }
          }));
        }).catch(function (e) { window.__hzPending[pack] = null; throw e; });
      }
      jobs.push(window.__hzPending[pack]);
    }
    if (!jobs.length) return Promise.resolve();
    return Promise.all(jobs).catch(function (e) {
      window.__hzReady = window.__hzBaseReady && window.__hzPacks[pack] === 'ready';
      throw e;
    });
  };
  /* 空闲预取：只预取当前年级小包，不再全量拉取 2.4 MB 字库 */
  addEventListener('load', function () {
    var go = function () { window.loadHanzi('idle', window.SX_GRADE || 1).catch(function () {}); };
    ('requestIdleCallback' in window) ? requestIdleCallback(go, { timeout: 2500 }) : setTimeout(go, 1200);
  });
  </script>

  <!-- 缓存自检：若浏览器混用了新旧脚本，给出明确提示，避免显示串科的错乱页面 -->
  <script>
  window.addEventListener('load', function () {
    setTimeout(function () {
      var EXPECTED = '1.6.0';
      var C = window.APP_CONFIG;
      var content = document.getElementById('content');
      var tabsBox = document.querySelector('.module-tabs');
      /* 字库为异步加载，HANZI_PINYIN 不参与版本一致性判定，避免误报 */
      var bad = !C || C.version !== EXPECTED || !window.BasicData ||
                !content || !content.children.length;
      /* 锁定占位页本来就没有模块标签，属于正常情况，跳过比对 */
      if (!bad && tabsBox) {
        var btn = document.querySelector('.subject-btn.on');
        var sid = btn ? btn.getAttribute('data-v') : 'chinese';
        var expected = C.modulesFor ? C.modulesFor(sid).length : 0;
        bad = expected < 1 || tabsBox.querySelectorAll('.module-tab').length !== expected;
      }
      if (!bad) return;
      var bar = document.createElement('div');
      bar.id = 'cache-warn';
      bar.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:9999;padding:10px 16px;background:#fff3cd;border-bottom:1px solid #f0c36d;color:#7a4b00;font-size:13px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08)');
      var guardKey = 'suixueban_auto_reload';
      var tried = 0;
      try { tried = parseInt(sessionStorage.getItem(guardKey) || '0', 10) || 0; } catch (e) {}
      if (!tried) {
        bar.textContent = '检测到页面脚本版本不一致，正在为你加载新版…';
        try { sessionStorage.setItem(guardKey, '1'); } catch (e) {}
        document.body.appendChild(bar);
        setTimeout(function () { location.reload(); }, 600);
      } else {
        bar.textContent = '页面脚本版本仍不一致，请按 Ctrl + F5 强制刷新，或关闭本页后重新打开。';
        document.body.appendChild(bar);
      }
    }, 500);
  });
  </script>
</body>
</html>
